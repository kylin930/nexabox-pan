<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>NexaboxDrive</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        button { padding: 8px 15px; cursor: pointer; margin-right: 5px; }
        #log { white-space: pre-wrap; background: #f4f4f4; padding: 10px; font-size: 12px; max-height: 200px; overflow-y: auto;}
        .folder-link { font-weight: bold; text-decoration: none; color: #0078d4; cursor: pointer; }
        .folder-link:hover { text-decoration: underline; }
        ul { list-style-type: none; padding-left: 0; }
        li { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #eee; }
        .path-info { color: #888; font-size: 12px; margin-left: 10px; }
    </style>
</head>
<body>
    <h1>NexaboxDrive</h1>

    <div class="card" style="background-color: #f9f9f9;">
        <h3 style="margin-top: 0;">当前路径: <span id="pathDisplay">/</span></h3>
        <button id="btnGoUp" onclick="goUp()" style="display: none;">返回上一级</button>
        <button onclick="createFolder()">新建文件夹</button>
        <button onclick="loadFiles()">刷新列表</button>
        
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <input type="text" id="searchInput" placeholder="全局搜索文件或文件夹..." style="flex: 1; padding: 5px;">
            <button onclick="searchFiles()">搜索</button>
        </div>
    </div>

    <div class="card">
        <h3>上传到当前目录</h3>
        
        <div style="margin-bottom: 10px;">
            <label style="font-weight: bold; display: inline-block; width: 100px;">多文件直传：</label>
            <input type="file" id="fileInput" multiple />
            <button onclick="startUpload(false)">开始上传文件</button>
        </div>
        
        <div style="margin-bottom: 10px;">
            <label style="font-weight: bold; display: inline-block; width: 100px;">文件夹上传：</label>
            <input type="file" id="folderInput" webkitdirectory multiple />
            <button onclick="startUpload(true)">开始上传文件夹</button>
        </div>

        <p id="uploadStatus" style="color: #0078d4; font-weight: bold;">就绪</p>
    </div>

    <div class="card">
        <h3>文件列表</h3>
        <ul id="fileList"></ul>
    </div>

    <h4>运行日志</h4>
    <div id="log"></div>

  <script>
        const ACCOUNT_URL = 'https://accounts.nexabox.de'; 
        const APP_NAME = 'NexaboxDrive';
        let currentPath = '/';
        
        // 缓存当前展示的列表数据（支持跨目录的搜索结果下载）
        let currentDataList = []; 
    
        function checkAuth() {
            const urlParams = new URLSearchParams(window.location.search);
            const tokenFromUrl = urlParams.get('token');
            if (tokenFromUrl) {
                localStorage.setItem('pan_token', tokenFromUrl);
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            const token = localStorage.getItem('pan_token');
            if (!token) {
                const currentUrl = encodeURIComponent(window.location.href);
                window.location.href = `${ACCOUNT_URL}/login.html?app=${APP_NAME}&redirect=${currentUrl}`;
                return null;
            }
            return token;
        }
    
        const token = checkAuth();
    
        async function apiFetch(url, options = {}) {
            if (!options.headers) options.headers = {};
            options.headers['Authorization'] = `Bearer ${token}`; 
            
            const res = await fetch(url, options);
            if (res.status === 401 || res.status === 403) {
                alert('登录已过期或无访问权限，请重新登录！');
                localStorage.removeItem('pan_token');
                window.location.reload();
            }
            return res;
        }
      
      const CHUNK_SIZE = 250 * 1024 * 1024; 
      const OSS_BASE_URL = 'https://teachermate.oss-cn-qingdao.aliyuncs.com/';
  
      function log(msg) {
          const logDiv = document.getElementById('log');
          logDiv.innerText += msg + '\n';
          logDiv.scrollTop = logDiv.scrollHeight;
      }
  
      async function initServiceWorker() {
          if ('serviceWorker' in navigator) {
              try {
                  await navigator.serviceWorker.register('/sw.js');
                  log("Service Worker 注册成功！");
                  if (!navigator.serviceWorker.controller) {
                      await new Promise(resolve => navigator.serviceWorker.addEventListener('controllerchange', resolve));
                  }
              } catch (err) { log(`Service Worker 注册失败: ${err}`); }
          }
      }
      
      window.onload = async () => {
          await initServiceWorker();
          loadFiles();
      };
  
      // --- 文件夹与路径导航逻辑 ---
      async function createFolder() {
          const folderName = prompt("请输入文件夹名称：");
          if (!folderName) return;
          try {
              const res = await apiFetch('/api/folder', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ name: folderName, path: currentPath })
              });
              const data = await res.json();
              if (data.success) {
                  log(`文件夹 ${folderName} 创建成功`);
                  loadFiles();
              } else alert(data.error);
          } catch (e) { alert("创建文件夹失败"); }
      }

      function enterFolder(folderName, forcePath = null) {
          // 如果是从全局搜索中点击进来的，使用它强制传过来的绝对父级路径
          if (forcePath) {
              currentPath = forcePath === '/' ? `/${folderName}/` : `${forcePath}${folderName}/`;
          } else {
              currentPath = currentPath === '/' ? `/${folderName}/` : `${currentPath}${folderName}/`;
          }
          loadFiles();
      }

      function goUp() {
          // 如果当前处于搜索结果页，点击返回直接重置为原先的目录
          if (document.getElementById('pathDisplay').innerText.startsWith('搜索')) {
              loadFiles();
              return;
          }
          if (currentPath === '/') return;
          const parts = currentPath.split('/').filter(p => p !== '');
          parts.pop(); 
          currentPath = parts.length === 0 ? '/' : '/' + parts.join('/') + '/';
          loadFiles();
      }

      // --- 核心修改：支持多文件和保留层级的文件夹批量上传 ---
      async function startUpload(isFolderUpload) {
          const inputId = isFolderUpload ? 'folderInput' : 'fileInput';
          const fileElement = document.getElementById(inputId);
          const files = fileElement.files;
          
          if (!files.length) return alert("请先选择内容！");
          
          document.getElementById('uploadStatus').innerText = `准备上传 ${files.length} 个文件...`;
          document.getElementById('uploadStatus').style.color = 'orange';

          // 记录本次上传中已经动态创建过的虚拟文件夹，防止发重复请求
          const sessionCreatedDirs = new Set();
  
          for (let fIdx = 0; fIdx < files.length; fIdx++) {
              const file = files[fIdx];
              const originalName = file.name;
              
              // 决定文件的最终目标路径
              let targetPath = currentPath;
              
              // 如果是上传文件夹，webkitRelativePath 会包含类似于 "图片/2024/logo.png" 的相对层级
              if (isFolderUpload && file.webkitRelativePath) {
                  const pathParts = file.webkitRelativePath.split('/');
                  pathParts.pop(); // 剔除文件名，保留纯目录数组
                  const relPath = pathParts.join('/'); 
                  
                  targetPath = currentPath === '/' ? `/${relPath}/` : `${currentPath}${relPath}/`;
                  
                  // 逐级检查并创建虚拟文件夹记录
                  let incrementalPath = currentPath;
                  for (const part of pathParts) {
                      const newPath = incrementalPath === '/' ? `/${part}/` : `${incrementalPath}${part}/`;
                      if (!sessionCreatedDirs.has(newPath)) {
                          await apiFetch('/api/folder', {
                              method: 'POST',
                              headers: { 'Content-Type': 'application/json' },
                              body: JSON.stringify({ name: part, path: incrementalPath })
                          });
                          sessionCreatedDirs.add(newPath);
                          log(`[系统] 自动建立虚拟目录层级: ${newPath}`);
                      }
                      incrementalPath = newPath;
                  }
              }

              const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
              const chunkUrls = [];
              
              log(`[${fIdx+1}/${files.length}] 开始上传至 ${targetPath} : ${originalName}`);
              document.getElementById('uploadStatus').innerText = `进度 (${fIdx+1}/${files.length}): 正在上传 ${originalName} (0/${totalChunks})`;
  
              for (let i = 0; i < totalChunks; i++) {
                  const start = i * CHUNK_SIZE;
                  const end = Math.min(start + CHUNK_SIZE, file.size);
                  const chunkBlob = file.slice(start, end, 'image/png');
                  const chunkIndex = String(i + 1).padStart(3, '0');
                  const fakeFileName = `${originalName}.${chunkIndex}.png`;
                  
                  try {
                      const sigRes = await apiFetch('/api/signature');
                      const ossData = await sigRes.json();
                      if (!ossData.signature) throw new Error("获取签名失败");
  
                      const timestamp = new Date().getTime();
                      const nameWithoutExt = fakeFileName.substring(0, fakeFileName.lastIndexOf('.')); 
                      const ossKey = `${nameWithoutExt}-${timestamp}-${fakeFileName}`;
  
                      const formData = new FormData();
                      formData.append('Signature', ossData.signature);
                      formData.append('OSSAccessKeyId', ossData.accessKeyId);
                      formData.append('policy', ossData.policy);
                      formData.append('success_action_status', '200');
                      formData.append('key', ossKey);
                      formData.append('file', chunkBlob, fakeFileName);
  
                      const ossHost = ossData.host || OSS_BASE_URL;
                      const uploadRes = await apiFetch(ossHost, { method: 'POST', body: formData });
  
                      if (uploadRes.status === 200 || uploadRes.status === 204) {
                          chunkUrls.push(`${OSS_BASE_URL}${ossKey}`);
                          document.getElementById('uploadStatus').innerText = `进度 (${fIdx+1}/${files.length}): 正在上传 ${originalName} (${i+1}/${totalChunks})`;
                      } else {
                          throw new Error(`OSS 上传失败: ${uploadRes.status}`);
                      }
                  } catch (e) {
                      log(`[错误] ${originalName} 分块上传中断: ${e.message}`);
                      break; // 跳出当前文件的切片循环，继续上传下一个文件
                  }
              }
              
              // 只有所有切片都完整收集，才写入元数据
              if (chunkUrls.length === totalChunks) {
                  await apiFetch('/api/files', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({
                          filename: originalName,
                          size: file.size,
                          chunks: chunkUrls,
                          path: targetPath 
                      })
                  });
              }
          }
  
          document.getElementById('uploadStatus').innerText = "✅ 批处理上传完成！";
          document.getElementById('uploadStatus').style.color = 'green';
          fileElement.value = ""; 
          loadFiles(); 
      }
      
      // --- 新增：全局搜索接口联动 ---
      async function searchFiles() {
          const keyword = document.getElementById('searchInput').value.trim();
          if (!keyword) return loadFiles(); 

          document.getElementById('pathDisplay').innerText = `搜索结果: "${keyword}"`;
          document.getElementById('btnGoUp').style.display = 'inline-block'; 

          try {
              const res = await apiFetch(`/api/search?keyword=${encodeURIComponent(keyword)}`);
              currentDataList = await res.json();
              renderFileList(currentDataList, true); 
          } catch (e) { alert("搜索失败"); }
      }

      // --- 加载文件列表 ---
      async function loadFiles() {
            document.getElementById('pathDisplay').innerText = currentPath;
            document.getElementById('btnGoUp').style.display = currentPath === '/' ? 'none' : 'inline-block';
            document.getElementById('searchInput').value = ''; 

            const res = await apiFetch(`/api/files?path=${encodeURIComponent(currentPath)}`);
            currentDataList = await res.json();
            renderFileList(currentDataList, false);
      }
      
      // 抽离统一的 DOM 渲染逻辑
      function renderFileList(files, isSearch = false) {
          const list = document.getElementById('fileList');
          list.innerHTML = '';
            
          if (files.length === 0) {
              list.innerHTML = '<li style="color: #999;">无数据或暂未收录</li>';
              return;
          }
  
          files.forEach(f => {
              const li = document.createElement('li');
              const pathTag = isSearch ? `<span class="path-info">所在位置: ${f.path}</span>` : '';
              
              if (f.isFolder) {
                  li.innerHTML = `
                      📁 <a class="folder-link" onclick="enterFolder('${f.filename}', '${isSearch ? f.path : null}')">${f.filename}</a> 
                      ${pathTag}
                      <button style="margin-top:5px; margin-left:10px;" onclick="createShare('${f.id}')">生成分享</button>
                  `;
              } else {
                  li.innerHTML = `
                      📄 <strong>${f.filename}</strong> <span style="color:#666;font-size:14px;">(${(f.size/1024/1024).toFixed(2)} MB)</span> 
                      ${pathTag} <br>
                      <button style="margin-top:5px;" onclick="downloadStream('${f.id}')">流式下载</button>
                      <button style="margin-top:5px;" onclick="createShare('${f.id}')">生成分享</button> 
                  `;
              }
              list.appendChild(li);
          });
      }
    
        async function createShare(fileId) {
            const pwdInput = prompt("请输入提取码（选填，留空则为公开分享）：");
            if (pwdInput === null) return; 
            const password = pwdInput.trim();
            try {
                const res = await apiFetch('/api/share', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fileId, password })
                });
                const data = await res.json();
                if (data.success) {
                    const fullShareUrl = window.location.origin + data.url;
                    let msg = `分享链接已生成：\n${fullShareUrl}`;
                    if (password) msg += `\n提取码：${password}`;
                    prompt("请复制分享信息：", msg);
                } else alert("生成失败：" + (data.error || "未知错误"));
            } catch (e) { alert("请求分享接口失败！"); }
        }
  
      async function downloadStream(fileId) {
          if (!navigator.serviceWorker.controller) return alert("Service Worker 未就绪，请刷新重试！");
          
          // 【优化】直接从缓存的 currentDataList 查找数据，不再发 API。同时完美解决了从搜索结果页点下载时的跨目录问题。
          const fileData = currentDataList.find(f => f.id === fileId);
          if (!fileData) return alert("文件元数据丢失，请尝试刷新列表！");
  
          const taskId = `task_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
          navigator.serviceWorker.controller.postMessage({
              type: 'PREPARE_DOWNLOAD', id: taskId,
              filename: fileData.filename, chunks: fileData.chunks, size: fileData.size
          });
  
          log(`准备调起下载内核引擎处理文件: ${fileData.filename}`);
          setTimeout(() => {
              const iframe = document.createElement('iframe');
              iframe.style.display = 'none';
              iframe.src = `/virtual-download/${taskId}`; 
              document.body.appendChild(iframe);
              setTimeout(() => { document.body.removeChild(iframe); }, 10000);
          }, 300);
      }
  </script>
</body>
</html>
